name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint new date logic and tests
        run: "bunx eslint src/delux/utils/date.ts src/test/date.test.ts src/delux/ai/intent.ts src/test/assistant-intent.test.ts --rule 'prettier/prettier: 0'"
      - name: Test
        run: bun run test
      - name: TypeScript check
        run: bunx tsc --noEmit
        continue-on-error: true
      - name: Build
        run: bun run build
